# SDXL DeepCache container workflow (Cloud AI SDK 1.23)
#
# With utils/ on PATH, from this recipe directory:
#   mkdir -p cache onnx_files qpc compile_logs images
#   qaic-container build
#   qaic-container run --rm export
#   qaic-container run --rm inference --prompt "<your prompt>"
#
# `export` follows README steps 5-8: fetch the VAE decoder, run
# run_config_deep.sh (ONNX + QPC compile, block size 256), apply the
# README-step-7 DeepCache shallow switch, run run_config_shallow.sh.
# `inference` runs run_config_inference.sh and writes one image by default
# (add --num-warmup-iters 3 --num-repeat-iters 3 for the full benchmark).
# Extra flags after `inference` are passed through to main.py; later flags
# win. `export` takes no flags.
#
# Results persist in this recipe folder on the host: cache/, onnx_files/,
# qpc/, compile_logs/, images/.
services:
  export:
    build:
      context: .
      target: export
      args: &identity
        HOST_UID: ${HOST_UID:?Use qaic-container to set host identity}
        HOST_GID: ${HOST_GID:?Use qaic-container to set host identity}
        QAIC_GID: ${QAIC_GID:?Use qaic-container to set host identity}
    image: sdxl-deepcache-export:${HOST_UID:?Use qaic-container}-${HOST_GID:?Use qaic-container}-${QAIC_GID:?Use qaic-container}
    working_dir: /opt/recipe
    volumes: &persist
      - type: bind
        source: ./cache
        target: /opt/recipe/cache
        bind:
          create_host_path: false
      - type: bind
        source: ./onnx_files
        target: /opt/recipe/onnx_files
        bind:
          create_host_path: false
      - type: bind
        source: ./qpc
        target: /opt/recipe/qpc
        bind:
          create_host_path: false
      - type: bind
        source: ./compile_logs
        target: /opt/recipe/compile_logs
        bind:
          create_host_path: false
      - type: bind
        source: ./images
        target: /opt/recipe/images
        bind:
          create_host_path: false
    command:
      - bash
      - -c
      - |
        set -e
        VAE=cache/stabilityai/stable-diffusion-xl-base-1.0/vae_decoder/model.onnx
        if [ ! -f "$$VAE" ]; then
          echo "[export] fetching SDXL VAE decoder to $$VAE"
          mkdir -p "$$(dirname "$$VAE")"
          curl -fL --retry 3 -o "$$VAE" \
            "https://huggingface.co/stabilityai/stable-diffusion-xl-base-1.0/resolve/main/vae_decoder/model.onnx"
        fi
        bash run_config_deep.sh
        echo "[export] switching installed DeepCache UNet to shallow mode (README step 7)"
        sed -i '963s/False/True/' env_onnx/lib/python3.12/site-packages/DeepCache/sdxl/unet_2d_condition.py
        bash run_config_shallow.sh
        echo "[export] complete; host outputs in cache/, onnx_files/, qpc/, compile_logs/"
  inference:
    build:
      context: .
      target: pipeline
      args: *identity
    image: sdxl-deepcache-pipeline:${HOST_UID:?Use qaic-container}-${HOST_GID:?Use qaic-container}-${QAIC_GID:?Use qaic-container}
    working_dir: /opt/recipe
    volumes: *persist
    group_add:
      - "${QAIC_GID:?Use qaic-container to set host identity}"
    # Expose the AI100 accelerator devices to the container for inference.
    devices:
      - /dev/accel:/dev/accel
    # `docker compose run SERVICE ARGS` overrides the service command, so the
    # launcher lives in entrypoint (final element = $0 placeholder) and any
    # CLI flags arrive as "$@".
    entrypoint:
      - bash
      - -c
      - |
        set -e
        bash run_config_inference.sh env_pipeline/bin/python3 \
          --num-warmup-iters 0 --num-repeat-iters 1 "$$@"
        echo "[inference] image saved (host-visible): $$(pwd)/$$(ls -1t images/*.jpg | head -1)"
      - bash
    command: []
