# SD3.5-medium container workflow (Cloud AI SDK 1.23)
#
# With utils/ on PATH, from this recipe directory:
#   mkdir -p cache onnx_files qpc compile_logs images
#   qaic-container build
#   qaic-container run --rm export
#   qaic-container run --rm inference --prompt "<your prompt>" --neg_prompt "<your negative prompt>"
#
# `export` follows README section 2: generate the ONNX models (CLIP text
# encoders, T5 text_encoder_3, transformer, VAE decoder) and compile all QPCs.
# stable-diffusion-3.5-medium is gated on Hugging Face: the run reads the host
# login token (~/.cache/huggingface/token, read-only; the scripts set
# HF_HOME=cache, so Hugging Face picks it up as cache/token) and downloads the
# gated weights into cache/ on first use. `inference` follows README section 3
# on device 0 (transformer QPC); --prompt and --neg_prompt are both required,
# and it writes one image by default (add
# --num-warmup-iters 3 --num-repeat-iters 3 for the full benchmark). Extra
# flags after `inference` are passed through to main.py; later flags win.
# `export` takes no flags.
#
# Results persist in this recipe folder on the host: cache/, onnx_files/,
# qpc/, compile_logs/, images/. A full export peaks around 100 GB across
# cache/ (gated weights), onnx_files/ (incl. T5 simplification
# intermediates), and qpc/.
services:
  export:
    build:
      context: .
      target: export
      args: &identity
        HOST_UID: ${HOST_UID:?Use qaic-container to set host identity}
        HOST_GID: ${HOST_GID:?Use qaic-container to set host identity}
        QAIC_GID: ${QAIC_GID:?Use qaic-container to set host identity}
    image: sd35-export:${HOST_UID:?Use qaic-container}-${HOST_GID:?Use qaic-container}-${QAIC_GID:?Use qaic-container}
    working_dir: /opt/recipe
    volumes: &persist
      - type: bind
        source: ./cache
        target: /opt/recipe/cache
        bind:
          create_host_path: false
      - type: bind
        source: ./onnx_files
        target: /opt/recipe/onnx_files
        bind:
          create_host_path: false
      - type: bind
        source: ./qpc
        target: /opt/recipe/qpc
        bind:
          create_host_path: false
      - type: bind
        source: ./compile_logs
        target: /opt/recipe/compile_logs
        bind:
          create_host_path: false
      - type: bind
        source: ./images
        target: /opt/recipe/images
        bind:
          create_host_path: false
      # HF_HOME=cache makes Hugging Face read the token from cache/token.
      - ~/.cache/huggingface/token:/opt/recipe/cache/token:ro
    command:
      - bash
      - -c
      - |
        set -e
        # qaic-compile refuses a binary output dir that already exists; export
        # regenerates all QPCs, so start from an empty qpc/ (generated
        # artifacts, not sources).
        rm -rf qpc/*
        bash run_config_gen.sh
        echo "[export] complete; host outputs in cache/, onnx_files/, qpc/, compile_logs/"
  inference:
    build:
      context: .
      target: pipeline
      args: *identity
    image: sd35-pipeline:${HOST_UID:?Use qaic-container}-${HOST_GID:?Use qaic-container}-${QAIC_GID:?Use qaic-container}
    working_dir: /opt/recipe
    volumes: *persist
    group_add:
      - "${QAIC_GID:?Use qaic-container to set host identity}"
    # Expose the AI100 accelerator devices to the container for inference.
    devices:
      - /dev/accel:/dev/accel
    # `docker compose run SERVICE ARGS` overrides the service command, so the
    # launcher lives in entrypoint (final element = $0 placeholder) and any
    # CLI flags arrive as "$@".
    entrypoint:
      - bash
      - -c
      - |
        set -e
        # Prompts come from the user; fail fast with usage instead of baking
        # a sample prompt into committed content. Both are required so the
        # shape matches a fully specified run_config_inference.sh invocation;
        # the empty positional defaults below are overridden by the user's
        # later --prompt / --neg_prompt flags (last-flag-wins passthrough).
        [[ " $$* " == *" --prompt "* && " $$* " == *" --neg_prompt "* ]] || \
          { echo "[inference] usage: qaic-container run --rm inference --prompt <prompt_in_quotes> --neg_prompt <prompt_in_quotes>"; exit 1; }
        bash run_config_inference.sh "" "" \
          --num-warmup-iters 0 --num-repeat-iters 1 "$$@"
        echo "[inference] image saved (host-visible): $$(pwd)/$$(ls -1t images/*.jpg | head -1)"
      - bash
    command: []
