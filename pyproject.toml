[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qaic_models"
version = "0.1.0"
description = "Qualcomm Cloud AI model wrappers and pipelines"
readme = "qaic_models/README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Qualcomm Cloud AI ML Team" }]
keywords = ["Cloud AI 100", "Inference"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 5 - Development/Unstable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: Linux",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence for Inference Accelerator",
]

# Core dependencies common to all qaic_models code (keep minimal)
dependencies = []

[project.optional-dependencies]
# Mask R-CNN pipeline
"mask-rcnn" = [
  "numpy==1.23 ; python_version == '3.10'",
  "numpy==1.26.4 ; python_version == '3.12'",
  "onnx==1.13.1 ; python_version == '3.10'",
  "onnx==1.18.0 ; python_version == '3.12'",
  "onnxruntime>=1.16",
  "onnx-simplifier",
  "opencv-python-headless==3.4.18.65 ; python_version == '3.10'",
  "opencv-python-headless==4.10.0.84 ; python_version == '3.12'",
  "Pillow==9.5.0 ; python_version == '3.10'",
  "Pillow==10.4.0 ; python_version == '3.12'",
  "PyYAML",
  "fvcore",
  "cloudpickle",
  "omegaconf",
  "pycocotools",
  "fairscale",
  "timm",
  "torch@https://download.pytorch.org/whl/cpu/torch-1.13.1%2Bcpu-cp310-cp310-linux_x86_64.whl ; python_version=='3.10' and platform_machine=='x86_64'",
  "torchvision@https://download.pytorch.org/whl/cpu/torchvision-0.14.1%2Bcpu-cp310-cp310-linux_x86_64.whl ; python_version=='3.10' and platform_machine=='x86_64'",
  "torch@https://download.pytorch.org/whl/cpu/torch-2.5.1%2Bcpu-cp312-cp312-linux_x86_64.whl ; python_version=='3.12' and platform_machine=='x86_64'",
  "torchvision@https://download.pytorch.org/whl/cpu/torchvision-0.20.1%2Bcpu-cp312-cp312-linux_x86_64.whl ; python_version=='3.12' and platform_machine=='x86_64'",
  "qaic@file:///opt/qti-aic/dev/lib/x86_64/qaic-0.0.1-py3-none-any.whl"
]
"mask-rcnn-infer" = [
  "numpy==1.23 ; python_version == '3.10'",
  "numpy==1.26.4 ; python_version == '3.12'",
  "onnxruntime>=1.16",
  "Pillow==9.5.0 ; python_version == '3.10'",
  "Pillow==10.4.0 ; python_version == '3.12'",
  "qaic@file:///opt/qti-aic/dev/lib/x86_64/qaic-0.0.1-py3-none-any.whl",
  "PyYAML",
]
"triton" = [
  "tritonclient[all]",
]
# YOLO11 detect export pipeline (Ultralytics -> ONNX -> QAIC)
"yolo11" = [
  "numpy",
  "onnx",
  "onnxruntime>=1.16",
  "onnx-simplifier",
  "Pillow",
  "PyYAML",
  "torch@https://download.pytorch.org/whl/cpu/torch-2.3.1%2Bcpu-cp310-cp310-linux_x86_64.whl ; python_version=='3.10' and platform_machine=='x86_64'",
  "torchvision@https://download.pytorch.org/whl/cpu/torchvision-0.18.1%2Bcpu-cp310-cp310-linux_x86_64.whl ; python_version=='3.10' and platform_machine=='x86_64'",
  "torch@https://download.pytorch.org/whl/cpu/torch-2.3.1%2Bcpu-cp312-cp312-linux_x86_64.whl ; python_version=='3.12' and platform_machine=='x86_64'",
  "torchvision@https://download.pytorch.org/whl/cpu/torchvision-0.18.1%2Bcpu-cp312-cp312-linux_x86_64.whl ; python_version=='3.12' and platform_machine=='x86_64'",
  # ultralytics-opencv-headless installs the same `ultralytics` module as the
  # standard `ultralytics` package, but depends on opencv-python-headless
  # instead of opencv-python (GUI/X11 build), which fails to import in
  # headless containers with "libxcb.so.1: cannot open shared object file".
  "ultralytics-opencv-headless",
  "qaic@file:///opt/qti-aic/dev/lib/x86_64/qaic-0.0.1-py3-none-any.whl"
]
"yolo11-infer" = [
  "numpy",
  "onnxruntime>=1.16",
  "Pillow",
  "PyYAML",
  "qaic@file:///opt/qti-aic/dev/lib/x86_64/qaic-0.0.1-py3-none-any.whl",
]
"yolo26" = [
  "numpy",
  "onnx",
  "onnxruntime>=1.16",
  "onnx-simplifier",
  "Pillow",
  "PyYAML",
  "torch@https://download.pytorch.org/whl/cpu/torch-2.3.1%2Bcpu-cp310-cp310-linux_x86_64.whl ; python_version=='3.10' and platform_machine=='x86_64'",
  "torchvision@https://download.pytorch.org/whl/cpu/torchvision-0.18.1%2Bcpu-cp310-cp310-linux_x86_64.whl ; python_version=='3.10' and platform_machine=='x86_64'",
  "torch@https://download.pytorch.org/whl/cpu/torch-2.3.1%2Bcpu-cp312-cp312-linux_x86_64.whl ; python_version=='3.12' and platform_machine=='x86_64'",
  "torchvision@https://download.pytorch.org/whl/cpu/torchvision-0.18.1%2Bcpu-cp312-cp312-linux_x86_64.whl ; python_version=='3.12' and platform_machine=='x86_64'",
  "ultralytics-opencv-headless",
  "qaic@file:///opt/qti-aic/dev/lib/x86_64/qaic-0.0.1-py3-none-any.whl"
]
"yolo26-infer" = [
  "numpy",
  "onnxruntime>=1.16",
  "Pillow",
  "PyYAML",
  "qaic@file:///opt/qti-aic/dev/lib/x86_64/qaic-0.0.1-py3-none-any.whl",
]
# LPRNet Chinese license plate OCR (PyTorch -> ONNX -> QAIC)
# numpy is pinned to 1.x: the CPU torch 1.13.1 wheel is compiled against
# NumPy 1.x and breaks at runtime with NumPy 2.x ("Numpy is not available").
"lprnet" = [
  "numpy==1.23 ; python_version == '3.10'",
  "numpy==1.26.4 ; python_version == '3.12'",
  "PyYAML",
  "onnx",
  "onnxruntime>=1.16",
  "onnx-simplifier",
  "opencv-python-headless",
  "Pillow",
  "torch@https://download.pytorch.org/whl/cpu/torch-1.13.1%2Bcpu-cp310-cp310-linux_x86_64.whl ; python_version=='3.10' and platform_machine=='x86_64'",
  "torch@https://download.pytorch.org/whl/cpu/torch-2.5.1%2Bcpu-cp312-cp312-linux_x86_64.whl ; python_version=='3.12' and platform_machine=='x86_64'",
  "qaic@file:///opt/qti-aic/dev/lib/x86_64/qaic-0.0.1-py3-none-any.whl"
]
"lprnet-infer" = [
  "numpy==1.23 ; python_version == '3.10'",
  "numpy==1.26.4 ; python_version == '3.12'",
  "PyYAML",
  "onnxruntime>=1.16",
  "opencv-python-headless",
  "Pillow",
  "qaic@file:///opt/qti-aic/dev/lib/x86_64/qaic-0.0.1-py3-none-any.whl",
]
# PP-DocLayoutV3 + PP-OCRv6 layout/detection/recognition export pipeline
"paddle-ocr" = [
  "numpy",
  "PyYAML",
  "onnx",
  "onnxruntime>=1.16",
  "onnx-simplifier",
  "opencv-python-headless",
  "PyMuPDF",
  "Pillow",
  "pyclipper",
  "shapely",
  "huggingface-hub",
  "safetensors",
  "transformers @ git+https://github.com/huggingface/transformers.git@d56c55bf564ddb176759eb6ec199442682564916",
  # The pinned Transformers commit requires torch >= 2.5 for PP-DocLayoutV3.
  "torch@https://download.pytorch.org/whl/cpu/torch-2.5.1%2Bcpu-cp310-cp310-linux_x86_64.whl ; python_version=='3.10' and platform_machine=='x86_64'",
  "torch@https://download.pytorch.org/whl/cpu/torch-2.5.1%2Bcpu-cp312-cp312-linux_x86_64.whl ; python_version=='3.12' and platform_machine=='x86_64'",
  "qaic@file:///opt/qti-aic/dev/lib/x86_64/qaic-0.0.1-py3-none-any.whl",
]
"paddle-ocr-infer" = [
  "numpy",
  "PyYAML",
  "onnxruntime>=1.16",
  "opencv-python-headless",
  "PyMuPDF",
  "Pillow",
  "pyclipper",
  "shapely",
  "qaic@file:///opt/qti-aic/dev/lib/x86_64/qaic-0.0.1-py3-none-any.whl",
]
# F5-TTS text-to-speech pipeline (export + compile + runtime).
# F5-TTS and Vocos themselves are intentionally NOT listed here: they are
# installed from pinned upstream git checkouts with `pip install -e --no-deps`
# (see qaic_models/speech/f5_tts/README.md) to avoid pulling their own
# unpinned, training-oriented dependencies (gradio, wandb, accelerate,
# bitsandbytes, datasets, an unpinned torch/vocos). This extra lists every
# transitive dependency F5-TTS/Vocos actually need at runtime, pinned to the
# versions already validated by the standalone models/speech/f5-tts recipe.
"f5-tts" = [
  "numpy==1.26.4",
  "onnx==1.18.0",
  "onnxruntime==1.22.1",
  "onnxconverter-common==1.15.0",
  "safetensors==0.5.0",
  "omegaconf==2.3.0",
  "soundfile==0.13.1",
  "pydub==0.25.1",
  "jieba==0.42.1",
  "pypinyin==0.55.0",
  "librosa==0.11.0",
  "scipy==1.15.3",
  "einops==0.8.1",
  "encodec==0.1.1",
  "huggingface-hub==0.34.4",
  "transformers==4.55.2",
  "x-transformers==2.7.2",
  "torchdiffeq==0.2.5",
  "hydra-core==1.3.2",
  "torch@https://download.pytorch.org/whl/cpu/torch-2.8.0%2Bcpu-cp310-cp310-manylinux_2_28_x86_64.whl ; python_version=='3.10' and platform_machine=='x86_64'",
  "torchaudio@https://download.pytorch.org/whl/cpu/torchaudio-2.8.0%2Bcpu-cp310-cp310-manylinux_2_28_x86_64.whl ; python_version=='3.10' and platform_machine=='x86_64'",
  "torch@https://download.pytorch.org/whl/cpu/torch-2.8.0%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl ; python_version=='3.12' and platform_machine=='x86_64'",
  "torchaudio@https://download.pytorch.org/whl/cpu/torchaudio-2.8.0%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl ; python_version=='3.12' and platform_machine=='x86_64'",
  "qaic@file:///opt/qti-aic/dev/lib/x86_64/qaic-0.0.1-py3-none-any.whl"
]
"f5-tts-infer" = [
  "numpy==1.26.4",
  "onnxruntime==1.22.1",
  "omegaconf==2.3.0",
  "soundfile==0.13.1",
  "pydub==0.25.1",
  "jieba==0.42.1",
  "pypinyin==0.55.0",
  "qaic@file:///opt/qti-aic/dev/lib/x86_64/qaic-0.0.1-py3-none-any.whl",
]
# F5-TTS Triton python-backend serving: the f5-tts-infer runtime plus the
# CPU torch/torchaudio wheels needed for the host-side STFT/ISTFT stage.
"f5-tts-serve" = [
  "numpy==1.26.4",
  "onnxruntime==1.22.1",
  "omegaconf==2.3.0",
  "soundfile==0.13.1",
  "pydub==0.25.1",
  "jieba==0.42.1",
  "pypinyin==0.55.0",
  "torch@https://download.pytorch.org/whl/cpu/torch-2.8.0%2Bcpu-cp310-cp310-manylinux_2_28_x86_64.whl ; python_version=='3.10' and platform_machine=='x86_64'",
  "torchaudio@https://download.pytorch.org/whl/cpu/torchaudio-2.8.0%2Bcpu-cp310-cp310-manylinux_2_28_x86_64.whl ; python_version=='3.10' and platform_machine=='x86_64'",
  "torch@https://download.pytorch.org/whl/cpu/torch-2.8.0%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl ; python_version=='3.12' and platform_machine=='x86_64'",
  "torchaudio@https://download.pytorch.org/whl/cpu/torchaudio-2.8.0%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl ; python_version=='3.12' and platform_machine=='x86_64'",
  "qaic@file:///opt/qti-aic/dev/lib/x86_64/qaic-0.0.1-py3-none-any.whl",
]

[tool.setuptools.package-data]
# Mask R-CNN package resources
"qaic_models.vision.segmentation.mask_rcnn" = ["model.yaml", "*.yaml"]
# Ultralytics YOLO package resources
"qaic_models.vision.ultralytics.yolo11.detect" = ["model.yaml"]
"qaic_models.vision.ultralytics.yolo11.classify" = ["model.yaml"]
"qaic_models.vision.ultralytics.yolo26.detect" = ["model.yaml"]
"qaic_models.vision.ultralytics.yolo26.classify" = ["model.yaml"]
# F5-TTS package resources
"qaic_models.speech.f5_tts" = ["model.yaml"]
# LPRNet package resources
"qaic_models.vision.ocr.lprnet" = ["model.yaml"]
# PaddleOCR package resources
"qaic_models.vision.ocr.paddle_ocr" = ["model.yaml"]

[project.urls]
Homepage = "https://github.com/qualcomm/cloud-ai-sdk"
Source = "https://github.com/qualcomm/cloud-ai-sdk"

[tool.setuptools.packages.find]
# Include the canonical qaic_models namespace.
include = [
  "qaic_models*",
]
