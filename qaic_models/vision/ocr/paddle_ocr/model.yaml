id: paddle-ocr
display_name: PaddleOCR PP-DocLayoutV3 + PP-OCRv6
aliases: [pp-ocrv6-medium, pp-ocrv6]
domain: vision
task: ocr
provider: paddle-ocr
family: pp-ocrv6

variants:
  - name: pipeline
    default: true

source:
  framework: paddlepaddle
  kind: huggingface
  repos:
    - PaddlePaddle/PP-DocLayoutV3_safetensors
    - PaddlePaddle/PP-OCRv6_medium_det_onnx
    - PaddlePaddle/PP-OCRv6_medium_rec_onnx
  license: apache-2.0

dataset:
  name: pp-ocrv6-medium
  classes: 18710

io:
  inputs:
    - name: pixel_values
      shape: [1, 3, 704, 704]
      dtype: float32
      layout: NCHW
      color: RGB
      stage: layout
      preprocessing: stretch_704x704_bicubic_div255
    - name: x
      shape: [1, 3, 640, 640]
      dtype: float32
      layout: NCHW
      color: BGR
      stage: det
      preprocessing: letterbox_640x640_pad255_imagenet_norm_bgr
    - name: x
      shape: [1, 3, 48, 1536]
      dtype: float32
      layout: NCHW
      color: BGR
      stage: rec
      preprocessing: resize_h48_wcap1536_pad255_sub0.5_div0.5
  outputs:
    - name: logits
      shape: [1, 300, 25]
      dtype: float32
      stage: layout
      semantics: document_layout_class_logits
    - name: pred_boxes
      shape: [1, 300, 4]
      dtype: float32
      stage: layout
      semantics: normalized_cxcywh_document_layout_boxes
    - name: order_logits
      shape: [1, 300, 300]
      dtype: float32
      stage: layout
      semantics: pairwise_document_layout_reading_order_logits
    - name: out_masks
      shape: [1, 300, 176, 176]
      dtype: float32
      stage: layout
      optional: true
      semantics: optional_document_layout_mask_head_output_enabled_by_export_flag
    - name: fetch_name_0
      shape: [1, 1, 640, 640]
      dtype: float32
      stage: det
      semantics: text_region_probability_map_sigmoid_activated
    - name: ctc_token_ids
      shape: [1, 192]
      dtype: int32
      stage: rec
      semantics: greedy_ctc_argmax_token_id_per_timestep_blank_is_index_0
    - name: ctc_max_probs
      shape: [1, 192]
      dtype: float32
      stage: rec
      semantics: greedy_ctc_argmax_class_probability_per_timestep_softmaxed

defaults:
  det:
    thresh: 0.2
    box_thresh: 0.45
    unclip_ratio: 1.4
    min_box_size: 3
    onnx_opset: 14
  rec:
    blank_index: 0
    decode: greedy_ctc
    onnx_opset: 11

artifacts:
  onnx_fp16ready_layout: pp-doclayoutv3_704_fp16ready.onnx
  layout_node_precision: pp-doclayoutv3_fp32_cross_attention.yaml
  onnx_raw_det: pp-ocrv6-medium-det-onnx.onnx
  onnx_fp16ready_det: pp-ocrv6-medium-det-onnx_fp16ready.onnx
  onnx_raw_rec: pp-ocrv6-medium-rec-onnx.onnx
  onnx_preclip_rec: pp-ocrv6-medium-rec-onnx_preclip.onnx
  onnx_fp16ready_rec: pp-ocrv6-medium-rec-onnx_fp16ready.onnx
  char_dict: char_dict.txt
  qpc_det_latency: qpc_det_latency
  qpc_layout_latency: qpc_layout_latency
  qpc_rec_latency: qpc_rec_latency
  qpc_rec_throughput: qpc_rec_throughput
