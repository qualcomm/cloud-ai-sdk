id: yolo26_detect
display_name: YOLO26 Detect
aliases: [yolo26, yolo26m]
domain: vision
task: object_detection
provider: ultralytics
family: yolo26

variants:
  - name: yolo26n
  - name: yolo26s
  - name: yolo26m
    default: true
  - name: yolo26l
  - name: yolo26x

source:
  framework: ultralytics
  kind: pypi
  package: ultralytics-opencv-headless
  weights: yolo26m.pt
  license: agpl-3.0

dataset:
  name: coco
  classes: 80

io:
  inputs:
    - name: images
      shape: [1, 3, 640, 640]
      dtype: float32
      layout: NCHW
      color: RGB
      preprocessing: letterbox_640_pad114_div255
  outputs:
    - name: output0
      shape: [1, 300, 6]
      dtype: float32
      semantics: xyxy_conf_class_final_detections
      record_layout:
        batch_axis: 0
        record_axis: 1
        field_axis: 2
        fields:
          - {name: x1, index: 0}
          - {name: y1, index: 1}
          - {name: x2, index: 2}
          - {name: y2, index: 3}
          - {name: confidence, index: 4}
          - {name: class_id, index: 5}
        ranking: {field: confidence, reduction: identity}

defaults:
  confidence_threshold: 0.25
  labels: COCO_80

artifacts:
  onnx_fp16ready: "<variant>_fp16ready.onnx"
  qpc_latency: qpc_latency
  qpc_throughput: qpc_throughput

catalog:
  publish: true
  tags: [object-detection, yolo, coco80, ultralytics, ai100, fp16]
